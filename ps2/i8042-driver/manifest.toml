[package]
provenance = "built-in"
id = "org.mochios.ps2.i8042"
name = "i8042 Controller Driver"
version = "0.1.0"
vendor = "mochiOS"

[[binary]]
path = "/system/bin/drivers/ps2/i8042.driver/entry.elf"
kind = "driver"
driver_class = "input"
api_version = 1
match_bus = "platform"
match_class = "i8042"
requires = [
    "device.input",
    "io.port@0x60:1",
    "io.port@0x64:1",
    "io.port@0x3f8:1",
    "io.port@0x3fd:1",
    "ipc.client",
    "ipc.server",
]
